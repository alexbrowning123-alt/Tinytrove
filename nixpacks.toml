# Nixpacks build config for Railway.
#
# Why this exists: the app sets NODE_ENV=production as a runtime env var
# (required so auth cookies get the Secure flag). If that same env var is
# present during `npm install`, npm skips devDependencies — but the build
# step needs vite/esbuild/tsx from devDependencies. --include=dev forces
# them to install regardless of NODE_ENV.
[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
